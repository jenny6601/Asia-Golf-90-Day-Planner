name: 90-day forecast verification data
on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"
  push:
    branches: [feature/90day-validation-dashboard]
    paths:
      - "assets/js/trip-date-*.js"
      - "scripts/run-trip-date-forecast-backtest.mjs"
      - "tests/**"
      - ".github/workflows/90day-validation.yml"
permissions:
  contents: write
concurrency:
  group: 90day-validation
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/90day-validation-dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run unit tests
        run: npm test
      - name: Run archived forecast verification
        run: node scripts/run-trip-date-forecast-backtest.mjs
      - name: Publish app-readable verification JSON
        run: |
          mkdir -p assets/data
          cp artifacts/trip-date-backtest/backtest.json assets/data/90day-validation.json
      - name: Commit updated validation data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/90day-validation.json
          if git diff --cached --quiet; then
            echo "No validation data changes."
          else
            git commit -m "Publish rolling 90-day verification data"
            git push
          fi
