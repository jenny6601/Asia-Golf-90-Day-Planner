name: Daily Paired Weather Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 22 * * *"

permissions:
  contents: read

jobs:
  paired-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run unit tests
        run: npm test
      - name: Fetch paired WeatherAPI and Open-Meteo forecasts
        env:
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
        run: node scripts/fetch-paired-weather.mjs
      - name: Upload paired forecast snapshot
        uses: actions/upload-artifact@v4
        with:
          name: paired-weather-audit-${{ github.run_number }}
          path: artifacts/paired-weather-audit.json
          if-no-files-found: error
          retention-days: 14
