name: Date Engine Tests

on:
  push:
    branches: [main, asia-eight-country-shared-engine, feature/90day-accuracy-five-stage]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run unit tests
        run: npm test
      - name: Generate eight-country coverage audit
        run: node scripts/report-eight-country-coverage.mjs
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: eight-country-coverage
          path: artifacts/eight-country-coverage.json
          if-no-files-found: error
