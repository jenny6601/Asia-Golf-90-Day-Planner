# Default-branch dispatch entrypoint only.
# The acquisition code and all data work remain pinned to the development branch.
name: ERA5 Daily Climate Statistics Pilot (Dispatch)

on:
  workflow_dispatch:
    inputs:
      subregion:
        description: Registry subregion ID
        required: true
        default: JP-OKI-MAIN-NORTH
        type: string
      year:
        description: Single calendar year
        required: true
        default: "1991"
        type: string

permissions:
  contents: read

concurrency:
  group: era5-daily-climate-statistics-pilot
  cancel-in-progress: false

jobs:
  acquire-daily-only:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout development branch only
        uses: actions/checkout@v4
        with:
          ref: asia-eight-country-shared-engine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CDS dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-data.txt
      - name: Configure CDS credentials
        env:
          CDSAPI_KEY: ${{ secrets.CDS_API_KEY }}
        run: |
          test -n "$CDSAPI_KEY" || { echo "Missing CDS_API_KEY; no request sent."; exit 1; }
          umask 077
          printf '%s\n' 'url: https://cds.climate.copernicus.eu/api' "key: $CDS_API_KEY" > "$HOME/.cdsapirc"
      - name: Retrieve ERA5 daily aggregates only
        run: |
          python scripts/acquire_daily_climate_statistics_pilot.py \
            --subregion "${{ inputs.subregion }}" \
            --year "${{ inputs.year }}" \
            --output-dir data/daily-statistics-pilot
      - name: Upload daily-statistics archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: era5-daily-stats-${{ inputs.subregion }}-${{ inputs.year }}
          path: data/daily-statistics-pilot/
          if-no-files-found: warn
          retention-days: 90
