name: ERA5-Land Full Dataset Regional Pilot
on:
  push:
    branches: [asia-eight-country-shared-engine]
    paths:
      - "scripts/acquire_era5_land_full_dataset_pilot.py"
      - "tests/test_era5_land_full_dataset_pilot.py"
      - ".github/workflows/era5-land-full-dataset-pilot.yml"
      - "requirements-data.txt"
  workflow_dispatch:
    inputs:
      subregion:
        description: Current registry subregion ID
        required: true
        default: JP-OKI-NORTH
        type: string
      year:
        description: Single calendar year to acquire
        required: true
        default: "1991"
        type: string
permissions:
  contents: read
concurrency:
  group: era5-land-full-dataset-pilot
  cancel-in-progress: false
jobs:
  preflight:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: asia-eight-country-shared-engine}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m unittest tests/test_era5_land_full_dataset_pilot.py
      - run: python scripts/acquire_era5_land_full_dataset_pilot.py --subregion JP-OKI-NORTH --year 1991 --dry-run
  acquire-one-point-year:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: asia-eight-country-shared-engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install data dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-data.txt
      - name: Configure CDS credentials
        env:
          CDSAPI_KEY: \${{ secrets.CDS_API_KEY }}
        run: |
          test -n "$CDSAPI_KEY" || { echo "Missing CDS_API_KEY; no request sent."; exit 1; }
          umask 077
          printf '%s\n' 'url: https://cds.climate.copernicus.eu/api' "key: $CDSAPI_KEY" > "$HOME/.cdsapirc"
      - name: Run one-point one-year full-dataset pilot
        run: |
          python scripts/acquire_era5_land_full_dataset_pilot.py \
            --subregion "\${{ inputs.subregion }}" \
            --year "\${{ inputs.year }}" \
            --output-dir data/era5-land-full-dataset-pilot
      - name: Upload raw archive and inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: era5-land-\${{ inputs.subregion }}-\${{ inputs.year }}-full-dataset-pilot
          path: data/era5-land-full-dataset-pilot/
          if-no-files-found: warn
          retention-days: 90
