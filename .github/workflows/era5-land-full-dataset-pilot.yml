name: Legacy ERA5-Land hourly pilot (manual download disabled)
on:
  push:
    branches: [asia-eight-country-shared-engine]
    paths:
      - "scripts/acquire_daily_climate_statistics_pilot.py"
      - "tests/test_daily_climate_statistics_pilot.py"
      - ".github/workflows/daily-climate-statistics-pilot.yml"
permissions:
  contents: read
concurrency:
  group: daily-climate-statistics-pilot
  cancel-in-progress: false
jobs:
  preflight:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: asia-eight-country-shared-engine}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m unittest tests/test_daily_climate_statistics_pilot.py
      - run: python scripts/acquire_daily_climate_statistics_pilot.py --subregion JP-OKI-MAIN-NORTH --year 1991 --dry-run
  acquire-daily-only:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: asia-eight-country-shared-engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CDS dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-data.txt
      - name: Configure CDS credentials
        env:
          CDSAPI_KEY: ${{ secrets.CDS_API_KEY }}
        run: |
          test -n "$CDSAPI_KEY" || { echo "Missing CDS_API_KEY; no request sent."; exit 1; }
          umask 077
          printf '%s\n' 'url: https://cds.climate.copernicus.eu/api' "key: $CDSAPI_KEY" > "$HOME/.cdsapirc"
      - name: Retrieve daily aggregates only
        run: |
          python scripts/acquire_daily_climate_statistics_pilot.py \
            --subregion "${{ inputs.subregion }}" \
            --year "${{ inputs.year }}" \
            --output-dir data/daily-statistics-pilot
      - name: Upload daily-statistics archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-stats-${{ inputs.subregion }}-${{ inputs.year }}
          path: data/daily-statistics-pilot/
          if-no-files-found: warn
          retention-days: 90
