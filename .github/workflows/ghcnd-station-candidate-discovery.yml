name: GHCN-Daily Station Candidate Discovery

on:
  push:
    branches: [asia-eight-country-shared-engine]
    paths:
      - "scripts/discover_ghcnd_station_candidates.py"
      - "scripts/validate_ghcnd_daily_record_coverage.py"
      - "scripts/build_jp_kr_official_acquisition_queue.py"
      - "scripts/discover_jma_station_candidates.py"
      - "scripts/discover_kma_asos_candidates.py"
      - "tests/test_kma_asos_candidates.py"
      - "tests/test_jma_station_candidates.py"
      - "tests/test_jp_kr_official_acquisition_queue.py"
      - "tests/test_ghcnd_daily_record_coverage.py"
      - "tests/test_ghcnd_station_discovery.py"
      - "scripts/discover_metmalaysia_station_candidates.py"
      - "tests/test_metmalaysia_station_candidates.py"
      - "data/era5-land-eight-country-1991-2020/representative-point-quality-audit.json"
      - ".github/workflows/ghcnd-station-candidate-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ghcnd-station-candidate-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: asia-eight-country-shared-engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test global and Malaysia station candidate logic
        run: |
          python -m unittest tests/test_ghcnd_station_discovery.py
          python -m unittest tests/test_metmalaysia_station_candidates.py
          python -m unittest tests/test_ghcnd_daily_record_coverage.py
          python -m unittest tests/test_jp_kr_official_acquisition_queue.py
          python -m unittest tests/test_jma_station_candidates.py
          python -m unittest tests/test_kma_asos_candidates.py
      - name: Download public NOAA metadata and rank station candidates
        run: python scripts/discover_ghcnd_station_candidates.py --top-n 10
      - name: Download official MET Malaysia station inventory and rank candidates
        run: python scripts/discover_metmalaysia_station_candidates.py --top-n 10
      - name: Build official Japan and Korea station acquisition queue
        run: python scripts/build_jp_kr_official_acquisition_queue.py
      - name: Rank KMA ASOS candidates when official station metadata CSV is supplied
        shell: bash
        run: |
          if [ -f data/observation-stations/input/kma-station-metadata.csv ]; then
            python scripts/discover_kma_asos_candidates.py --inventory data/observation-stations/input/kma-station-metadata.csv
          else
            echo "KMA candidate ranking skipped: official full station-history CSV has not been supplied; no station candidates are fabricated."
          fi
      - name: Discover JMA AMeDAS candidates for Japan regional points
        run: python scripts/discover_jma_station_candidates.py
      - name: Audit actual NOAA daily records for bounded regional shortlist
        run: python scripts/validate_ghcnd_daily_record_coverage.py --per-region 3 --workers 8
      - name: Commit station candidate inventory to development branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observation-stations/ghcnd-candidates-1991-2020.json data/observation-stations/metmalaysia-candidates.json data/observation-stations/ghcnd-daily-record-audit-1991-2020.json data/observation-stations/jp-kr-official-acquisition-queue.json data/observation-stations/jma-station-candidates-1991-2020.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive GHCN station candidates for eight-country regions"
            git pull --rebase origin asia-eight-country-shared-engine
            git push origin asia-eight-country-shared-engine
          else
            echo "Station candidate inventory is unchanged."
          fi
      - name: Upload station candidate inventory
        uses: actions/upload-artifact@v4
        with:
          name: ghcnd-station-candidates-1991-2020
          path: |
            data/observation-stations/ghcnd-candidates-1991-2020.json
            data/observation-stations/metmalaysia-candidates.json
            data/observation-stations/ghcnd-daily-record-audit-1991-2020.json
            data/observation-stations/jp-kr-official-acquisition-queue.json
            data/observation-stations/jma-station-candidates-1991-2020.json
            data/observation-stations/kma-asos-candidates-1991-2020.json
          if-no-files-found: error
          retention-days: 90
