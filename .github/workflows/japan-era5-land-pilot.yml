name: Japan ERA5-Land Regional Pilot

on:
  push:
    branches:
      - asia-eight-country-shared-engine
    paths:
      - ".github/workflows/japan-era5-land-pilot.yml"
      - "scripts/era5_land_pilot.py"
      - "scripts/inspect_era5_land_pilot.py"
      - "scripts/aggregate_era5_land_daily.py"
      - "scripts/batch_era5_land_japan.py"
      - "config/global/era5-land-grid-points-japan.json"
      - "tests/test_era5_land_pilot.py"
      - "tests/test_era5_land_inspector.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: japan-era5-land-regional-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: asia-eight-country-shared-engine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ERA5-Land data dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-data.txt

      - name: Run request and inspector unit tests
        run: |
          python -m unittest tests/test_era5_land_pilot.py
          python -m unittest tests/test_era5_land_inspector.py

      - name: Verify CDS credential is configured
        env:
          CDSAPI_KEY: ${{ secrets.CDS_API_KEY }}
        shell: bash
        run: |
          if [ -z "$CDSAPI_KEY" ]; then
            echo "Missing repository secret CDS_API_KEY; no data request was sent."
            exit 1
          fi

      - name: Print the exact one-region pilot request
        run: |
          python scripts/era5_land_pilot.py --subregion JP-KNT-NORTH --start 1991-01-01 --end 1991-12-31 --print-request

      - name: Download, inspect and aggregate JP-KNT-NORTH 1991
        env:
          CDSAPI_KEY: ${{ secrets.CDS_API_KEY }}
        run: |
          python scripts/batch_era5_land_japan.py \
            --subregions JP-KNT-NORTH \
            --start-year 1991 \
            --end-year 1991 \
            --limit 1 \
            --retries 3 \
            --output-root data/era5-land-japan-1991-2020

      - name: Commit structurally validated daily pilot and manifest
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/era5-land-japan-1991-2020/daily/ data/era5-land-japan-1991-2020/reports/ data/era5-land-japan-1991-2020/batch-state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Archive validated Japan ERA5-Land regional pilot"
            git push origin asia-eight-country-shared-engine
          else
            echo "No structurally validated daily pilot data to commit."
          fi

      - name: Upload pilot raw data and validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japan-era5-land-JP-KNT-NORTH-1991-pilot
          path: |
            data/era5-land-japan-1991-2020/
          if-no-files-found: warn
          retention-days: 90
