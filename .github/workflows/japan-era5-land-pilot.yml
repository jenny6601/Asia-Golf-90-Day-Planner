name: Japan ERA5-Land Regional Pilot

on:
  push:
    branches:
      - asia-eight-country-shared-engine
    paths:
      - ".github/workflows/japan-era5-land-pilot.yml"
      - "scripts/era5_land_pilot.py"
      - "scripts/inspect_era5_land_pilot.py"
      - "scripts/aggregate_era5_land_daily.py"
      - "scripts/batch_era5_land_japan.py"
      - "scripts/audit_japan_era5_daily.py"
      - "scripts/compare_jma_station_daily.py"
      - "config/global/era5-land-grid-points-japan.json"
      - "tests/test_era5_land_pilot.py"
      - "tests/test_era5_land_inspector.py"
      - "tests/test_era5_land_daily_aggregation.py"
      - "tests/test_audit_japan_era5_daily.py"
      - "tests/test_batch_era5_land_japan.py"
      - "tests/test_compare_jma_station_daily.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: japan-era5-land-regional-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: asia-eight-country-shared-engine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ERA5-Land data dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-data.txt

      - name: Run request and inspector unit tests
        run: |
          python -m unittest tests/test_era5_land_pilot.py
          python -m unittest tests/test_era5_land_inspector.py
          python -m unittest tests/test_era5_land_daily_aggregation.py
          python -m unittest tests/test_audit_japan_era5_daily.py
          python -m unittest tests/test_batch_era5_land_japan.py
          python -m unittest tests/test_compare_jma_station_daily.py

      - name: Configure CDS API credentials
        env:
          CDSAPI_KEY: ${{ secrets.CDS_API_KEY }}
        shell: bash
        run: |
          test -n "$CDSAPI_KEY" || { echo "Missing repository secret CDS_API_KEY; no data request was sent."; exit 1; }
          umask 077
          {
            printf '%s\n' 'url: https://cds.climate.copernicus.eu/api'
            printf 'key: %s\n' "$CDSAPI_KEY"
          } > "$HOME/.cdsapirc"

      - name: Print the exact one-region pilot request
        run: |
          python scripts/era5_land_pilot.py --subregion JP-KNT-NORTH --start 1991-01-01 --end 1991-12-31 --print-request

      - name: Download, inspect and aggregate JP-KNT-NORTH 1991
        env:
          CDSAPI_KEY: ${{ secrets.CDS_API_KEY }}
        run: |
          python scripts/batch_era5_land_japan.py \
            --subregions JP-KNT-NORTH \
            --start-year 1991 \
            --end-year 1991 \
            --limit 1 \
            --retries 3 \
            --force \
            --output-root data/era5-land-japan-1991-2020

      - name: Run Japan regional daily QA audit
        if: success()
        shell: bash
        run: |
          python scripts/audit_japan_era5_daily.py \
            data/era5-land-japan-1991-2020/daily/JP-KNT-NORTH-1991-daily.json \
            --start-year 1991 \
            --end-year 1991 \
            --subregions JP-KNT-NORTH \
            --skip-climate-windows \
            --batch-state data/era5-land-japan-1991-2020/batch-state.json \
            --output data/era5-land-japan-1991-2020/reports/JP-KNT-NORTH-1991-qa.json

      - name: Print pilot failure diagnostics
        if: always()
        shell: bash
        run: |
          STATE="data/era5-land-japan-1991-2020/batch-state.json"
          if [ -f "$STATE" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("data/era5-land-japan-1991-2020/batch-state.json").read_text(encoding="utf-8"))
          for task_id, task in p.get("tasks", {}).items():
              print(json.dumps({"taskId": task_id, "status": task.get("status"), "attempts": task.get("attempts"), "error": task.get("error")}, ensure_ascii=False, indent=2))
          PY
          else
            echo "No batch-state.json was produced."
          fi

      - name: Commit structurally validated daily pilot and manifest
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push --include-untracked -m "preserve-pilot-generated-data"
          git fetch origin asia-eight-country-shared-engine
          git rebase origin/asia-eight-country-shared-engine
          git stash pop
          git add data/era5-land-japan-1991-2020/daily/ data/era5-land-japan-1991-2020/reports/ data/era5-land-japan-1991-2020/batch-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive validated Japan ERA5-Land regional pilot"
            git push origin asia-eight-country-shared-engine
          else
            echo "No new validated pilot data to commit."
          fi

      - name: Upload pilot raw data and validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japan-era5-land-JP-KNT-NORTH-1991-pilot
          path: |
            data/era5-land-japan-1991-2020/
          if-no-files-found: warn
          retention-days: 90
