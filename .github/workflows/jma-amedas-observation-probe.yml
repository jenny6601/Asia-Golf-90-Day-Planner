name: JMA AMeDAS Observation Probe

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */3 * * *"

permissions:
  contents: read

jobs:
  collect-observations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Collect raw JMA AMeDAS observations
        run: node scripts/fetch-jma-amedas-probe.mjs
      - name: Upload raw observation probe
        uses: actions/upload-artifact@v4
        with:
          name: jma-amedas-probe-${{ github.run_number }}
          path: artifacts/jma-amedas-observation-probe.json
          if-no-files-found: error
          retention-days: 30
