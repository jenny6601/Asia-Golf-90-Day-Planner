name: Okinawa Six-Course Weather Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - asia-eight-country-shared-engine
    paths:
      - "config/okinawa/course-coordinate-candidates.json"
      - "config/okinawa/jma-amedas-stations.json"
      - "config/global/courses.json"
      - "scripts/validate-okinawa-course-weather.mjs"
      - "scripts/forecast-completeness.js"
      - "scripts/validate-okinawa-long-range.mjs"
      - "scripts/jma-amedas-validation.js"
      - "scripts/validate-okinawa-jma-observations.mjs"
      - "scripts/validate-okinawa-six-hour-playability.mjs"
      - "assets/js/six-hour-playability.js"
      - "assets/js/taiwan-hourly-renderer.js"
      - "tests/six-hour-playability.test.js"
      - "tests/forecast-completeness.test.js"
      - "tests/okinawa-long-range-validation.test.js"
      - "tests/jma-amedas-validation.test.js"
      - "tests/okinawa-course-weather-acceptance.test.js"
      - "tests/okinawa-courses.test.js"
      - "assets/js/okinawa-courses.js"
      - ".github/workflows/okinawa-course-weather-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: okinawa-six-course-weather-acceptance
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run course database and acceptance tests
        run: |
          node --test tests/forecast-completeness.test.js
          node --test tests/okinawa-long-range-validation.test.js
          node --test tests/jma-amedas-validation.test.js
          node --test tests/six-hour-playability.test.js
          node --test tests/suitability-engine.test.js
          node --test tests/rain-risk.test.js
          node --test tests/pwa-playability.test.js
          node --test tests/okinawa-course-weather-acceptance.test.js
          node --test tests/global-catalog.test.js
      - name: Recheck 16-day course-point forecast and 90-day seasonal data
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/validate-okinawa-course-weather.mjs
      - name: Validate six-course D19-D90 seasonal and historical estimates
        run: node scripts/validate-okinawa-long-range.mjs
      - name: Compare archived forecasts with JMA AMeDAS observations
        run: node scripts/validate-okinawa-jma-observations.mjs
      - name: Validate six-hour tee-time suitability for all six courses
        run: node scripts/validate-okinawa-six-hour-playability.mjs
      - name: Upload Okinawa acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okinawa-six-course-weather-acceptance
          path: |
            artifacts/okinawa-acceptance/okinawa-course-weather-acceptance.json
            artifacts/okinawa-acceptance/okinawa-course-weather-acceptance.md
            artifacts/okinawa-acceptance/okinawa-long-range-validation.json
            artifacts/okinawa-acceptance/okinawa-long-range-validation.md
            artifacts/okinawa-acceptance/okinawa-jma-amedas-validation.json
            artifacts/okinawa-acceptance/okinawa-jma-amedas-validation.md
            artifacts/okinawa-acceptance/okinawa-six-hour-playability-validation.json
            artifacts/okinawa-acceptance/okinawa-six-hour-playability-validation.md
          if-no-files-found: warn
          retention-days: 30
