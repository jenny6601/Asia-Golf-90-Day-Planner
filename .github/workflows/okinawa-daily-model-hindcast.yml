name: Okinawa Daily Model Hindcast Verification

on:
  workflow_dispatch:
  schedule:
    - cron: "10 19 * * *"

permissions:
  contents: write

concurrency:
  group: okinawa-daily-model-hindcast
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout archive branch
        uses: actions/checkout@v4
        with:
          ref: asia-eight-country-shared-engine
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run validation and archive schema tests
        run: node --test tests/jma-amedas-validation.test.js tests/okinawa-model-source-ranking.test.mjs tests/okinawa-course-source-reliability.test.mjs tests/okinawa-seasonal-forecast-archive.test.mjs
      - name: Collect seven-day model hindcast verification
        id: verify
        continue-on-error: true
        run: node scripts/validate-okinawa-jma-observations.mjs
      - name: Rebuild model source reliability ranking
        if: steps.verify.outcome == 'success'
        run: node scripts/rank-okinawa-model-sources.mjs
      - name: Project station skill onto six golf courses
        if: steps.verify.outcome == 'success'
        run: node scripts/project-okinawa-course-source-reliability.mjs
      - name: Archive ECMWF 17-90 day seasonal forecast snapshot
        run: node scripts/archive-okinawa-seasonal-forecast.mjs
      - name: Pair seasonal forecasts with JMA regional observations
        run: node scripts/pair-okinawa-seasonal-forecasts-with-jma.mjs
      - name: Run seasonal observation pairing tests
        run: node --test tests/okinawa-seasonal-observation-pairing.test.mjs
      - name: Commit daily hindcast archive
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/okinawa/model-hindcast-archive data/okinawa/model-source-ranking data/okinawa/course-source-reliability data/okinawa/seasonal-forecast-archive data/okinawa/seasonal-observation-pairs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if [ -d data/okinawa/model-hindcast-archive ]; then git add data/okinawa/model-hindcast-archive/; fi
            if [ -d data/okinawa/model-source-ranking ]; then git add data/okinawa/model-source-ranking/; fi
            if [ -d data/okinawa/course-source-reliability ]; then git add data/okinawa/course-source-reliability/; fi
            if [ -d data/okinawa/seasonal-forecast-archive ]; then git add data/okinawa/seasonal-forecast-archive/; fi
            if [ -d data/okinawa/seasonal-observation-pairs ]; then git add data/okinawa/seasonal-observation-pairs/; fi
            git commit -m "Archive daily Okinawa model hindcast verification"
            git push
          else
            echo "No new hindcast report to commit."
          fi
      - name: Upload hindcast report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okinawa-model-hindcast-verification
          path: |
            data/okinawa/model-hindcast-archive/
            data/okinawa/model-source-ranking/
            data/okinawa/course-source-reliability/
            data/okinawa/seasonal-forecast-archive/
            data/okinawa/seasonal-observation-pairs/
            artifacts/okinawa-acceptance/okinawa-jma-amedas-validation.*
          if-no-files-found: warn
          retention-days: 90
