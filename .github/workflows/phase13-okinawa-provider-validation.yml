name: Phase 13 Okinawa Provider Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VISUAL_CROSSING_API_KEY: ${{ secrets.VISUAL_CROSSING_API_KEY }}
      FORECA_API_KEY: ${{ secrets.FORECA_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Phase 13 unit tests
        run: npm test
      - name: Collect live Okinawa provider coverage
        run: node scripts/collect-okinawa-live-weather.mjs
      - name: Upload Phase 13 validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase13-okinawa-provider-validation
          path: artifacts/okinawa-live-weather/
          if-no-files-found: error
          retention-days: 14
