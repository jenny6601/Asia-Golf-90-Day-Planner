name: Phase 13 Okinawa Provider Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VISUAL_CROSSING_API_KEY: ${{ secrets.VISUAL_CROSSING_API_KEY }}
      FORECA_API_KEY: ${{ secrets.FORECA_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Phase 13 unit tests
        run: npm test
      - name: Collect live Okinawa provider coverage
        run: node scripts/collect-okinawa-live-weather.mjs
      - name: Publish provider coverage summary
        if: success()
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          const base = "artifacts/okinawa-live-weather/";
          const summary = JSON.parse(await fs.readFile(base + "provider-coverage-summary.json", "utf8"));
          const lines = [
            "# Phase 13 Okinawa provider validation",
            "",
            "## Provider availability",
            "",
            "| Provider | Available courses | Unavailable | Skipped |",
            "|---|---:|---:|---:|",
            ...Object.entries(summary.providerAvailability).map(([name, value]) => "| " + name + " | " + value.available + " | " + value.unavailable + " | " + value.skipped + " |"),
            "",
            "## Six-hour playability coverage",
            "",
            "| Course | GPS | Eligible days (2+ providers) | Three-provider complete days |",
            "|---|---|---:|---:|",
            ...summary.courses.map(course => "| " + course.courseName + " | " + course.coordinateStatus + " | " + course.eligibleDaysAtLeastTwoProviders + " | " + course.threeProviderCompleteDays + " |"),
            "",
            "Two-provider preliminary screening and strict three-provider comparison are reported separately. This smoke test is not forecast-accuracy validation."
          ];
          await fs.appendFile(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          NODE
      - name: Upload Phase 13 validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase13-okinawa-provider-validation
          path: artifacts/okinawa-live-weather/
          if-no-files-found: error
          retention-days: 14
