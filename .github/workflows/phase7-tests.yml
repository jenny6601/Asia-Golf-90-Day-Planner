name: Phase 7 Node tests

on:
  push:
    branches:
      - phase-7-one-click-90day
  pull_request:
    branches:
      - phase-6-live-data-contract

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run unit tests
        run: npm test
