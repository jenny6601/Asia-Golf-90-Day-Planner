name: Refresh 80-Region ERA5 Climate Baseline

on:
  workflow_dispatch:
  schedule:
    - cron: "15 18 1 */3 *"
  push:
    branches: [asia-eight-country-shared-engine]
    paths:
      - "scripts/build-eight-country-era5-baseline.mjs"
      - "config/global/weather-subregions.json"
      - "config/global/courses.json"
      - ".github/workflows/refresh-eight-country-era5.yml"

permissions:
  contents: write

concurrency:
  group: refresh-eight-country-era5
  cancel-in-progress: false

jobs:
  build-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: asia-eight-country-shared-engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build 30-year ERA5 daily climate normals for all 80 regions
        run: node scripts/build-eight-country-era5-baseline.mjs
      - name: Commit baseline dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/long-range/era5-1991-2020-normals.json
          git diff --cached --quiet || git commit -m "Refresh 80-region ERA5 climate baseline"
          git push origin asia-eight-country-shared-engine
