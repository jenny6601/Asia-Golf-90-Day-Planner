name: Retrieve SEAS5.1 System 51 hindcast pilot

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@v4
        with:
          ref: feature/ec46-seas5-api-audit-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CDS API client and ecCodes
        run: |
          python -m pip install --upgrade "cdsapi>=0.7.7" eccodes

      - name: Configure CDS API credentials
        shell: bash
        env:
          CDSAPI_KEY: ${{ secrets.CDS_API_KEY }}
        run: |
          test -n "$CDSAPI_KEY" || { echo "Missing repository secret CDS_API_KEY."; exit 1; }
          umask 077
          {
            printf '%s\n' 'url: https://cds.climate.copernicus.eu/api'
            printf 'key: %s\n' "$CDSAPI_KEY"
          } > "$HOME/.cdsapirc"

      - name: Retrieve the CDS-generated System 51 pilot request
        run: python scripts/retrieve-seas51-hindcast-pilot.py

      - name: Automatically audit GRIB metadata with ecCodes
        run: python scripts/audit-seas51-grib.py

      - name: Upload GRIB, manifest, and automatic audit
        uses: actions/upload-artifact@v4
        with:
          name: seas51-system51-hindcast-pilot-2016-01-01
          path: |
            seas51-2016-01-01-lead408-426-okinawa.grib
            seas51-pilot-manifest.json
            seas51-grib-audit.json
            seas51-grib-audit.md
          if-no-files-found: error
          retention-days: 30
