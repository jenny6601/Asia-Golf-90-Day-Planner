name: SEAS5.1 historical hindcast retrieval and GRIB audit
'on':
  workflow_dispatch:
  push:
    branches: [feature/90day-accuracy-five-stage]
    paths:
      - "scripts/retrieve-seas51-hindcast-pilot.py"
      - "scripts/audit-seas51-grib.py"
      - "scripts/extract-seas51-course-points.py"
      - "scripts/probe-seas51-precipitation-leads.py"
      - "scripts/inventory_cds_archive_batches.py"
      - "tests/test_inventory_cds_archive_batches.py"
      - "docs/CDS-MULTI-BATCH-INVENTORY.md"
      - ".github/workflows/seas51-hindcast-retrieval.yml"
permissions:
  contents: read
concurrency:
  group: seas51-hindcast-retrieval-${{ github.ref }}
  cancel-in-progress: true
jobs:
  retrieve-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CDS client and ecCodes
        run: python -m pip install --upgrade "cdsapi>=0.7.7" eccodes
      - name: Test archive normalization and ERA5 pairing
        run: python -m unittest discover -s tests -p "test_*seas51*.py" -v && python -m unittest discover -s tests -p "test_build_cds_era5_pairs.py" -v && python -m unittest discover -s tests -p "test_report_cds_era5_proxy_skill.py" -v && python -m unittest discover -s tests -p "test_split_cds_temporal_holdout.py" -v && python -m unittest discover -s tests -p "test_inventory_cds_archive_batches.py" -v
      - name: Configure CDS credentials
        env:
          CDSAPI_KEY: ${{ secrets.CDS_API_KEY }}
        run: |
          test -n "$CDSAPI_KEY" || { echo "CDS_API_KEY repository secret is unavailable"; exit 1; }
          umask 077
          printf '%s\n' 'url: https://cds.climate.copernicus.eu/api' "key: $CDSAPI_KEY" > "$HOME/.cdsapirc"
      - name: Retrieve historical pilot
        run: python scripts/retrieve-seas51-hindcast-pilot.py
      - name: Audit GRIB metadata
        run: python scripts/audit-seas51-grib.py
      # Run the precipitation diagnostic before spatial extraction so a
      # parser failure cannot suppress the independent lead-availability probe.
      - name: Probe precipitation leads individually
        run: python scripts/probe-seas51-precipitation-leads.py
      - name: Extract ensemble values at course-nearest grid points
        run: python scripts/extract-seas51-course-points.py
      - name: Normalize course-point archive batch
        run: python scripts/standardize_seas51_archive.py
      - name: Upload raw GRIB and machine-readable audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seas51-hindcast-pilot-and-audit
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
