name: Node test suite

on:
  push:
    branches:
      - feature/daily-climate-forecast-v2
      - asia-eight-country-shared-engine
  pull_request:
    branches:
      - asia-eight-country-shared-engine

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
