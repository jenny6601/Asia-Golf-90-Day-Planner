name: Trip Date Recommendation Engine Tests

'on':
  push:
    branches:
      - asia-eight-country-shared-engine
    paths:
      - "assets/js/trip-date-recommendation-engine.js"
      - "tests/trip-date-recommendation-engine.test.js"\n      - "assets/js/trip-date-source-adapters.js"\n      - "tests/trip-date-source-adapters.test.js"
      - ".github/workflows/trip-date-engine-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run trip date engine unit tests
        run: |\n          node --test tests/trip-date-recommendation-engine.test.js\n          node --test tests/trip-date-source-adapters.test.js
