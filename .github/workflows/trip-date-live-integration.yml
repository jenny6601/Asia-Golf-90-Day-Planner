name: Okinawa Trip Date Live Data Integration

'on':
  push:
    branches:
      - asia-eight-country-shared-engine
    paths:
      - "scripts/run-trip-date-recommendation-validation.mjs"
      - "scripts/run-trip-date-forecast-backtest.mjs"
      - "assets/js/trip-date-seasonal-backtest.js"
      - "assets/js/trip-date-seasonal-verification.js"
      - "tests/trip-date-seasonal-backtest.test.js"
      - "tests/trip-date-seasonal-verification.test.js"
      - "assets/js/trip-date-forecast-backtest.js"
      - "assets/js/trip-date-climatology-baseline.js"
      - "assets/js/trip-date-ranking-verification.js"
      - "tests/trip-date-ranking-verification.test.js"
      - "tests/trip-date-climatology-baseline.test.js"
      - "assets/js/trip-date-recommendation-engine.js"
      - "assets/js/trip-date-source-adapters.js"
      - "assets/js/weather-api.js"
      - "assets/js/long-range-api.js"
      - "config/global/courses.json"
      - ".github/workflows/trip-date-live-integration.yml"
  workflow_dispatch:
  schedule:
    - cron: "15 21 * * *" # 06:15 Asia/Tokyo daily

permissions:
  contents: write

concurrency:
  group: okinawa-trip-date-live-integration
  cancel-in-progress: true

jobs:
  live-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Retrieve live forecast, EC46/SEAS5 and ERA5 history and rank 5D4N windows
        run: node scripts/run-trip-date-recommendation-validation.mjs
      - name: Verify archived forecasts against ERA5 reference
        continue-on-error: true
        run: node scripts/run-trip-date-forecast-backtest.mjs
      - name: Persist one daily forecast snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/okinawa-forecast-snapshots/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive Okinawa daily forecast snapshot"
            git push
          else
            echo "No forecast snapshot changes to persist."
          fi
      - name: Upload recommendation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okinawa-trip-date-recommendations
          path: |
            artifacts/trip-date-recommendations/recommendations.json
            artifacts/trip-date-recommendations/recommendations.md
            artifacts/trip-date-backtest/backtest.json
            artifacts/trip-date-backtest/backtest.md
          if-no-files-found: warn
          retention-days: 30
