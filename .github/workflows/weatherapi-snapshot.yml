name: WeatherAPI Snapshot Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  fetch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run adapter unit tests
        run: npm test
      - name: Fetch WeatherAPI snapshot
        env:
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
        run: node scripts/fetch-weatherapi.mjs
      - name: Upload sanitized snapshot
        uses: actions/upload-artifact@v4
        with:
          name: weatherapi-okinawa-3day
          path: artifacts/weatherapi-3day.json
          if-no-files-found: error
          retention-days: 3
