name: WeatherAPI Adapter Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "assets/js/weatherapi-adapter.js"
      - "tests/weatherapi-adapter.test.js"
      - "tests/weather-api.test.js"
      - "package.json"
      - ".github/workflows/weatherapi-tests.yml"
  push:
    branches: [feature/weatherapi-adapter]
    paths:
      - "assets/js/weatherapi-adapter.js"
      - "tests/**"
      - "package.json"
      - ".github/workflows/weatherapi-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run unit tests
        run: npm test
